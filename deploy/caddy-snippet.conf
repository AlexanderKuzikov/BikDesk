# Append inside the main 135.106.192.125.nip.io block or as its own host.
# Thin proxy: BikDesk API listens on localhost:8789, PG stays closed by UFW.
bikdesk.135.106.192.125.nip.io {
    encode gzip
    handle /api/* {
        reverse_proxy localhost:8789
    }
    handle {
        respond "BikDesk: use /api/health, /api/banks/<bic>, /api/banks?name=, /api/dump" 200
    }
}
