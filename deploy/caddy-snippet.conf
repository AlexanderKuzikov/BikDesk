# BikDesk — Caddy фрагмент для VPS sat (135.106.192.125.nip.io)
# Отдельный блок-поддомен (без path-handle в главном блоке — API публичный read-only)
#
# ФС на VPS: /home/deploy/bikdesk/{src/,web/,data/}
# URL: https://bikdesk.135.106.192.125.nip.io/  →  Python API 127.0.0.1:8790
#   /             — веб-просмотр (фронт без сборки, отдаёт сам API)
#   /api/health, /api/banks/<bic>, /api/banks?name=, /api/dump
# Порт 8790: 8788 SerpGladys, 8789 StatGladys — заняты, не трогать

bikdesk.135.106.192.125.nip.io {
	encode gzip
	reverse_proxy localhost:8790
}
